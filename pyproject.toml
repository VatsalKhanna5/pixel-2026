[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel2026"
version = "0.1.0"
description = "Physics-Constrained Probabilistic Topology Synthesis for Inverse EM RF/IC Design"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/pixel-2026/pixel-2026"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

# -----------------------------------------------------------------------
# Black formatting
# -----------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py313"]

# -----------------------------------------------------------------------
# isort
# -----------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100

# -----------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
